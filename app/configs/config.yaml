mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883
  topics:
  - name: trigger
    topic: churchill/ui/ui_1/instruction
    is_trigger: true
    is_subscribe: true
  - name: image
    topic: churchill/camera/colour_1/image
    is_trigger: false
    is_subscribe: false
service:
  camera:
    camera_type: gige
    camera_id: colour_1
    capture_timeout: 50000
    camera_ip: 192.168.6.1
    serial_number: '000306'
    cti_path: C:\Users\Churchill-01\churchill\Baumer_GAPI_SDK_2.16.1_win_x86_64_c\bin\bgapi2_gige.cti
    sensor_type: rgb
  camera_settings:
    pixel_format: RGB8
    exposure_time_us: 10000
  trigger:
    trigger_type: software
    capture_type: single
  images:
  - default:
      image_format: null
      topic_end: null
      archive: true
  lights: {}
  archiving:
    is_archived: true
    archive_directory: ../data/images
    archive_parameters:
      archive_freq: daily
      archive_storage: 50
      archive_days: 30
