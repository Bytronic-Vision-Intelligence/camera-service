mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883
  topics:
  - name: trigger
    topic: indonesia/ui/ui_1/instruction
    is_trigger: true
    is_subscribe: true
  - name: image
    topic: indonesia/camera/thermal_1/image
    is_trigger: false
    is_subscribe: false
  - name: sku_selection
    topic: indonesia/ui/ui_1/sku_selection
    is_trigger: false
    is_subscribe: true
service:
  camera:
    camera_type: flir
    camera_id: thermal_1
    serial_number: 73400454
  camera_settings:
    camera_type: ax5
    burst_length: 1
    buffer_size: 1
    pixel_format: Mono14
    cmos_bit_depth: bit14bit
    temperature_linear_mode: true
    temperature_linear_resolution: High
  trigger:
    trigger_type: hardware
    capture_type: single
    trigger_source: Line0
    trigger_activation: RisingEdge
  images:
  - raw:
      image_type: uint16
      image_format: Mono14
      topic_end: raw
      archive: true
  - colourmap:
      image_type: uint8
      image_format:
        colourmap: JET
      topic_end: colourmap
      archive: false
  lights: {}
  archiving:
    is_archived: true
    archive_directory: ../data/images
    archive_parameters:
      archive_freq: daily
      archive_storage: 50
      archive_days: 30
      file_extension: png
