broker_details:
  mqtt_ip: localhost
  mqtt_port: 1883
  topics:
  - name: trigger
    topic: churchill/ui/ui_1/instruction
    is_trigger: true
    is_subscribe: true
  - name: image
    topic: churchill/camera/depth_1/image
    is_trigger: false
    is_subscribe: false
service:
  camera:
    camera_type: ljs
    camera_id: depth_1
    capture_timeout: 10000
    camera_ip: 192.168.0.1
    port: 24691
    high_speed_port: 24692
    device_id: 0
    program: 0
    use_image_filter: false
    interpolate_y: 4
  camera_settings:
    exposure_time_us: 640
    dynamic_range: 4
    light_control_mode: AUTO
    light_control_upper: 90
    light_control_lower: 10
    detection_sensitivity: 3
    burst_length: 1
    buffer_size: 2
  trigger:
    trigger_type: software
    capture_type: single
    trigger_delay: 0.5
  images:
  - default:
      image_format: uint16
      topic_end: null
      archive: true
  lights: {}
  archiving:
    is_archived: true
    archive_directory: ../data/images
    archive_parameters:
      archive_freq: daily
      archive_storage: 50
      archive_days: 30
