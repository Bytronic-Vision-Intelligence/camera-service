name: Build and Release production binaries

on:
  push:
    branches:
      - prod

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest

          - platform: linux-amd64
            runner: ubuntu-latest

          - platform: macos-arm64
            runner: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Workspace:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "App contents:"
          ls -la app

          echo "Dependencies:"
          find app/dependencies -maxdepth 3 -type f -print

          test -f app/main.py
          test -f requirements.txt
          test -d app/dependencies
          test -f app/dependencies/config.yaml

      - name: Build application
        uses: espressif/python-binary-action@master
        with:
          scripts: "app/main.py"
          output-dir: "./dist/${{ matrix.platform }}"
          target-platform: ${{ matrix.platform }}

          install-deps-command: >-
            uv pip install
            -r requirements.txt

          include-data-dirs: |
            {
              "*": [
                "./app/dependencies"
              ]
            }

      - name: Add editable config and logs folder
        shell: bash
        run: |
          set -euo pipefail

          output_dir="./dist/${{ matrix.platform }}"

          # Copy the config beside the executable.
          # Users can edit this file after extracting the ZIP.
          cp app/dependencies/config.yaml "$output_dir/config.yaml"

          # Create a visible logs directory.
          # .gitkeep ensures ZIP preserves the otherwise-empty directory.
          mkdir -p "$output_dir/logs"
          touch "$output_dir/logs/.gitkeep"

          echo "Final release contents:"
          find "$output_dir" -maxdepth 3 -print

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          output_dir="./dist/${{ matrix.platform }}"

          test -d "$output_dir"
          test -f "$output_dir/config.yaml"
          test -d "$output_dir/logs"

          file_count="$(find "$output_dir" -type f | wc -l)"
          test "$file_count" -gt 1

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-service-${{ matrix.platform }}
          path: "./dist/${{ matrix.platform }}"
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create ZIP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-upload

          for platform_dir in release-files/camera-service-*; do
            if [ ! -d "$platform_dir" ]; then
              continue
            fi

            platform="${platform_dir#release-files/camera-service-}"

            (
              cd "$platform_dir"
              zip -r "../../release-upload/camera-service-${platform}.zip" .
            )
          done

          echo "Release files:"
          ls -lh release-upload

          test -n "$(find release-upload -name '*.zip' -print -quit)"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release-upload
          sha256sum *.zip > SHA256SUMS

          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "prod-${{ github.run_number }}"
          name: "Production build ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release-upload/*.zip
            release-upload/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}