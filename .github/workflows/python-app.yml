# Installs dependencies, lints with flake8 and runs the pytest suite.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
#
# Rename `name:` below when you clone this template into a new service.
# Run it locally before opening a PR with ./docker-local/run.sh

name: camera-service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Backstop for anything pytest-timeout cannot cap - a stalled pip
    # resolve, a wheel download that never completes. Without it a hung job
    # holds a runner until GitHub's 6-hour default.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard against case-only rename drift
        run: |
          # macOS and Windows are case-insensitive, so a file can stay tracked
          # as Test_foo.py while the working tree shows test_foo.py. A Linux
          # runner then checks out the capitalised name, which pytest's default
          # test_*.py pattern does not collect - the suite silently shrinks and
          # CI still reports success.
          stray=$(git ls-files | grep -E '(^|/)Test_[^/]*\.py$' || true)
          if [ -n "$stray" ]; then
            echo "::error::These test files are tracked with capitalised names and will not be collected:"
            echo "$stray"
            exit 1
          fi
          echo "No capitalised test files tracked."

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          mkdir -p junit
          python -m pytest test --doctest-modules --junitxml=junit/test-results.xml
