mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883
  topics:
  - name: trigger
    topic: churchill/ui/ui_1/instruction
    is_trigger: true
    is_subscribe: true
  - name: image
    topic: churchill/camera/depth_1/image
    is_trigger: false
    is_subscribe: false
service:
  camera:
    camera_type: dummy
    camera_id: depth_1
    dummy_location: ../dev/dummy_depth
    file_type: .png
    capture_timeout: 1000
  camera_settings:
    buffer_size: 0
  trigger:
    trigger_type: software
    capture_type: single
    trigger_delay: 0.5
  images:
  - default:
      image_format: uint16
      topic_end: null
      archive: true
  lights: {}
  archiving:
    is_archived: true
    archive_directory: ../data/images
    archive_parameters:
      archive_freq: daily
      archive_storage: 50
      archive_days: 30
