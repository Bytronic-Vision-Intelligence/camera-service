[pytest]
# `.` supports `from app.dependencies... import ...`, the style used by the
# other Bytronic services. `app` supports `from main import ...` and
# `from dependencies... import ...`, exactly how the code imports at runtime.
# `scripts` is the release tooling, which ships in the repo but never in the
# binary.
pythonpath = . app scripts
testpaths = test

# No test here legitimately takes a minute. Without a cap, a test that blocks -
# an MQTT listener waiting on a stop event nothing sets, say - hangs the CI job
# until GitHub's 6-hour limit instead of failing.
timeout = 60
