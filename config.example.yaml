# camera-service: capture a frame on a trigger and publish it.
#
# This is the documented SHAPE of a camera-service configuration, and the copy
# that ships beside the binary in a release. It is not deployment config:
# service-orchestrator writes the real one and launches the binary pointed at
# it with --config, so one binary can serve several cameras.
#
# Tracked as config.example.yaml, never as config.yaml. The orchestrator writes
# config.yaml into this directory and this repository is PUBLIC, so a tracked
# config.yaml would leave a customer's brokers and topics one `git add -A` away
# from being published.

# Topic namespace for this installation.
project: project

mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883
  qos: 1

  # trigger: MQTT software subscribe+trigger (single) or on/off (continuous)
  # image: publish base; outputs append topic_end (e.g. /raw, /colourmap)
  # {camera_id} / {project} are filled from service.camera / project at startup.
  topics:
    - name: trigger
      topic: "{project}/camera/{camera_id}/trigger"
      is_subscribe: true
      is_trigger: true
    - name: image
      topic: "{project}/camera/{camera_id}/image"
      is_subscribe: false
    # result: only needed when filename_categories includes verdict.
    # Archive then waits for this message (status or verdict) and adds
    # __pass / __fail. Tune archive_parameters.verdict_timeout_s (default 30).
    # - name: result
    #   topic: "{project}/inspection/{camera_id}/result_ready"
    #   is_subscribe: true

service:
  camera:
    camera_type: dummy
    camera_id: colour
    capture_timeout: 10
    dummy_location: ../data/dummy_camera/colour
    file_type: bmp
    # serial_number / cti_path / camera_ip / port … for real backends

  # trigger_type: software | hardware
  # capture_type: single | continuous
  #
  # software + single     → MQTT trigger → one capture
  # software + continuous → MQTT on/off arms a timed capture stream
  # hardware + single     → camera line/edge IO → one frame
  # hardware + continuous → camera free-run stream
  trigger:
    trigger_type: software
    capture_type: single
    # trigger_delay: 1.0          # software/continuous interval (seconds)
    # continuous_fps: 2           # used if trigger_delay is 0
    # trigger_on_startup: true    # software/continuous: start streaming without MQTT on
    # trigger_source: Line1       # hardware/single
    # trigger_activation: RisingEdge

  images:
    - default:
        image_format: null
        topic_end: null
        archive: true

  camera_settings: {}
  lights: {}

  archiving:
    is_archived: true
    archive_directory: ../data
    archive_parameters:
      archive_freq: daily
      archive_storage: 50
      archive_days: 30
      # true uses uuid, camera_id, camera_type, image_type, sku_id, datetime, verdict.
      # false replaces that order with filename_categories.
      # sku_id is omitted until a selected_sku or a sku_update message supplies one.
      # verdict is omitted until a subscribed topic named result supplies one.
      default_order: true
      # filename_categories:
      #   - uuid
      #   - camera_id
      #   - datetime

logging:
  level: INFO
